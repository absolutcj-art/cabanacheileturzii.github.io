<style>
:root{
  --green:#214a38;
  --green2:#173a2b;
  --cream:#f5f0e6;
  --paper:#fffdf8;
  --gold:#b88a3b;
  --text:#242424;
  --muted:#6b6b65;
  --line:#e5dccd;
  --shadow:0 8px 24px rgba(25,45,35,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--cream);
  color:var(--text);
}
header{
  position:sticky;
  top:0;
  z-index:20;
  background:linear-gradient(135deg,var(--green2),var(--green));
  color:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,.18);
}
.hero{
  max-width:1000px;
  margin:auto;
  padding:18px 16px 12px;
  text-align:center;
}
.brand{
  font-family:Georgia,serif;
  font-size:clamp(28px,6vw,48px);
  letter-spacing:.04em;
  margin:0;
}
.subtitle{
  margin:5px 0 12px;
  color:#ead9b7;
  font-size:14px;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.controls{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
}
button,.search{
  border:1px solid rgba(255,255,255,.35);
  border-radius:999px;
}
.lang{
  background:rgba(255,255,255,.10);
  color:#fff;
  padding:9px 14px;
  font-weight:700;
  cursor:pointer;
}
.lang.active{background:#fff;color:var(--green2)}
.searchbar{
  max-width:1000px;
  margin:auto;
  padding:0 16px 14px;
}
.search{
  width:100%;
  padding:12px 15px;
  background:#fff;
  color:#222;
  font-size:16px;
  outline:none;
}
nav{
  background:#fff;
  border-bottom:1px solid var(--line);
  overflow:auto;
  white-space:nowrap;
  position:sticky;
  top:156px;
  z-index:15;
}
.nav-inner{
  max-width:1000px;
  margin:auto;
  display:flex;
  gap:6px;
  padding:9px 12px;
}
nav a{
  text-decoration:none;
  color:var(--green2);
  background:#f8f4ec;
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 12px;
  font-weight:700;
  font-size:14px;
}
main{
  max-width:1000px;
  margin:auto;
  padding:18px 14px 50px;
}
.category{
  scroll-margin-top:220px;
  margin:0 0 22px;
}
.category h2{
  font-family:Georgia,serif;
  color:var(--green2);
  margin:0 0 12px;
  font-size:clamp(25px,5vw,34px);
  border-bottom:2px solid var(--gold);
  padding-bottom:7px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  box-shadow:var(--shadow);
}
.card-top{
  display:flex;
  align-items:flex-start;
  gap:12px;
}
.name{
  font-size:18px;
  line-height:1.25;
  font-weight:800;
  flex:1;
}
.price{
  color:var(--green2);
  font-family:Georgia,serif;
  font-size:23px;
  line-height:1;
  white-space:nowrap;
  font-weight:700;
}
.meta{
  color:var(--gold);
  font-size:13px;
  font-weight:700;
  margin-top:5px;
}
.desc{
  margin-top:8px;
  color:var(--muted);
  line-height:1.4;
  font-size:14px;
}
.note{
  background:#fff7df;
  border-left:4px solid var(--gold);
  border-radius:10px;
  padding:12px 14px;
  margin-bottom:14px;
}
.allergens{
  background:var(--green2);
  color:#fff;
  border-radius:14px;
  padding:18px;
  box-shadow:var(--shadow);
}
.allergens ol{
  margin:10px 0 0;
  padding-left:23px;
  line-height:1.55;
}
footer{
  background:var(--green2);
  color:#fff;
  text-align:center;
  padding:24px 15px;
}
.hidden{display:none!important}
@media(max-width:720px){
  .grid{grid-template-columns:1fr}
  nav{top:164px}
  .card{padding:13px}
  .name{font-size:17px}
  .price{font-size:21px}
}
</style>
</head>

function render(){
  const q=search.value.trim().toLowerCase();
  nav.innerHTML="";
  menu.innerHTML="";

  categories.forEach(cat=>{
    const filtered=cat.items.filter(item=>{
      const text=[item.ro,item.en,item.hu,item.meta,item.price,item.desc?.ro,item.desc?.en,item.desc?.hu].join(" ").toLowerCase();
      return !q || text.includes(q);
    });
    if(!filtered.length) return;

    const link=document.createElement("a");
    link.href="#"+cat.id;
    link.textContent=cat.title[currentLang];
    nav.appendChild(link);

    const sec=document.createElement("section");
    sec.className="category";
    sec.id=cat.id;
    sec.innerHTML=`<h2>${cat.title[currentLang]}</h2><div class="grid"></div>`;
    const grid=sec.querySelector(".grid");

    filtered.forEach(item=>{
      const card=document.createElement("article");
      card.className="card";
      card.innerHTML=`
        <div class="card-top">
          <div class="name">${item[currentLang]}</div>
          <div class="price">${item.price}</div>
        </div>
        ${item.meta?`<div class="meta">${item.meta}</div>`:""}
        ${item.desc?`<div class="desc">${item.desc[currentLang]}</div>`:""}
      `;
      grid.appendChild(card);
    });

    menu.appendChild(sec);
  });

  const sec=document.createElement("section");
  sec.className="category";
  sec.id="allergens";
  sec.innerHTML=`
    <h2>${currentLang==="ro"?"Lista alergenilor":currentLang==="en"?"Allergen list":"Allergénlista"}</h2>
    <div class="allergens">
      <div>${currentLang==="ro"?"Informații disponibile la cerere. Lista generală a alergenilor:":currentLang==="en"?"Information available on request. General allergen list:":"Információ kérésre elérhető. Általános allergénlista:"}</div>
      <ol>${allergens.map(a=>`<li>${a}</li>`).join("")}</ol>
    </div>`;
  menu.appendChild(sec);

  const al=document.createElement("a");
  al.href="#allergens";
  al.textContent=currentLang==="ro"?"Alergeni":currentLang==="en"?"Allergens":"Allergének";
  nav.appendChild(al);
}

document.querySelectorAll(".lang").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".lang").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentLang=btn.dataset.lang;
    document.documentElement.lang=currentLang;
    search.placeholder=placeholders[currentLang];
    render();
  });
});

search.addEventListener("input",render);
render();
</script>
</body>
</html>
